<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Lift</title>
<meta name="description" content="Дневник тренировок: веса, подходы, рекорды, таймер отдыха">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/onest-cyr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Onest;src:url(fonts/onest-cyr.woff2) format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;src:url(fonts/onest-lat.woff2) format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:Num;src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap;unicode-range:U+0020-007E,U+00A0,U+00D7,U+2212,U+2013,U+202F}

:root{
  --bg:#FFFFFF;--bg2:#F3F4F6;--bg3:#E7E9EC;--tx:#0F1013;--mut:#82878F;--mut2:#B3B7BE;--line:#ECEDF0;
  --acc:var(--acc-l,#2F54EB);--on:var(--on-l,#FFFFFF);--sheet:#FFFFFF;--scrim:rgba(15,16,19,.28);--photo:#EEF0F2;--red:#E0362B;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--gut:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#0B0C0E;--bg2:#17181B;--bg3:#24262B;--tx:#F2F3F5;--mut:#7E838C;--mut2:#4B4F57;--line:#1D1F23;
  --acc:var(--acc-d,#8197FF);--on:var(--on-d,#0B0C0E);--sheet:#141518;--scrim:rgba(0,0,0,.6);--photo:#DCDEE2;--photo-f:brightness(.9);--seg-on:var(--bg3);--red:#FF5A4E}}
:root[data-theme=dark]{
  --bg:#0B0C0E;--bg2:#17181B;--bg3:#24262B;--tx:#F2F3F5;--mut:#7E838C;--mut2:#4B4F57;--line:#1D1F23;
  --acc:var(--acc-d,#8197FF);--on:var(--on-d,#0B0C0E);--sheet:#141518;--scrim:rgba(0,0,0,.6);--photo:#DCDEE2;--photo-f:brightness(.9);--seg-on:var(--bg3);--red:#FF5A4E}

/* розовые темы: --tx — глубокий ягодный вместо чёрного, им же заливается выполненный подход */
:root[data-theme=blush]{--bg:#FBF3F4;--bg2:#F4E4E7;--bg3:#EAD3D8;--tx:#3A2228;--mut:#94737B;--mut2:#C9AEB4;--line:#EFDDE1;--acc:#D45A82;--on:#FFFFFF;--sheet:#FFF8F9;--photo:#F4E4E7;--scrim:rgba(58,34,40,.28)}
:root[data-theme=sakura]{--bg:#FFF5F8;--bg2:#FCE6EE;--bg3:#F6D0DF;--tx:#4A1F33;--mut:#9C6F86;--mut2:#D3A9BC;--line:#F7E1EA;--acc:#E0508F;--on:#FFFFFF;--sheet:#FFFAFC;--photo:#FCE6EE;--scrim:rgba(74,31,51,.28)}
:root[data-theme=peony]{--bg:#FDF0F3;--bg2:#F9DDE5;--bg3:#F1C4D2;--tx:#5B1730;--mut:#A06478;--mut2:#D7A2B4;--line:#F5D9E1;--acc:#C2185B;--on:#FFFFFF;--sheet:#FFF7F9;--photo:#F9DDE5;--scrim:rgba(91,23,48,.28)}
:root[data-theme=marsh]{--bg:#FFF8FA;--bg2:#F8EEF3;--bg3:#EEDDE6;--tx:#2E2430;--mut:#8C7E8E;--mut2:#C3B5C3;--line:#F2E7EC;--acc:#E86A98;--on:#FFFFFF;--sheet:#FFFFFF;--photo:#F8EEF3;--scrim:rgba(46,36,48,.26)}
:root[data-theme=rosegold]{--bg:#FAF2EF;--bg2:#F2E2DD;--bg3:#E8CFC8;--tx:#3B2420;--mut:#94756D;--mut2:#C9ABA3;--line:#EEDDD7;--acc:#B9675B;--on:#FFFFFF;--sheet:#FFF9F7;--photo:#F2E2DD;--scrim:rgba(59,36,32,.28)}
:root[data-theme=flamingo]{--bg:#FFF1F3;--bg2:#FFDDE3;--bg3:#FFC5D0;--tx:#4D0F22;--mut:#A3566C;--mut2:#E39AAE;--line:#FFE1E7;--acc:#F23D6E;--on:#FFFFFF;--sheet:#FFF8F9;--photo:#FFDDE3;--scrim:rgba(77,15,34,.28)}
:root[data-theme=nightrose]{--bg:#1A1014;--bg2:#26171D;--bg3:#372229;--tx:#FBE9EF;--mut:#B08A97;--mut2:#6E4F5A;--line:#2A1A20;--acc:#FF8FB1;--on:#1A1014;--sheet:#201419;--photo:#E9D5DC;--photo-f:brightness(.92);--seg-on:var(--bg3);--scrim:rgba(0,0,0,.6);--red:#FF6B6B}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);overscroll-behavior:none;overflow:hidden}
body{font:400 16px/1.45 Onest,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;border:0;outline:0;background:none;border-radius:0;-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.n{font-family:Num,Onest,system-ui;font-stretch:72%;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.mut{color:var(--mut)}.acc{color:var(--acc)}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px}
.press{transition:opacity .15s}.press:active{opacity:.55}

.scroll{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#main{padding:calc(var(--st) + 22px) var(--gut) calc(var(--sb) + 110px)}
.eyebrow{font-size:14px;color:var(--mut);margin-bottom:4px}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:40px 0 6px}
.sec h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec button{font-size:15px;color:var(--acc)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;font-weight:600;font-size:17px;background:var(--tx);color:var(--bg);width:100%;transition:opacity .15s,transform .15s}
.btn:active{opacity:.8;transform:scale(.985)}
.btn.sec2{background:var(--bg2);color:var(--tx)}
.btn.link{background:none;color:var(--acc);height:46px}
.btn.del{background:none;color:var(--red);height:46px;font-weight:500}
.btn.sm{height:36px;font-size:15px;border-radius:10px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.3}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.ib:active{background:var(--bg2)}

/* лента недели */
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:26px -4px 10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px}
.wd span{font-size:12px;color:var(--mut)}
.wd b{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px}
.wd.on b{background:var(--tx);color:var(--bg)}
.wd.fut b{color:var(--mut2)}
.wd.today span{color:var(--acc);font-weight:600}
.wd.today:not(.on) b{box-shadow:inset 0 0 0 1.5px var(--bg3)}
.weeknote{font-size:14px;color:var(--mut);margin-bottom:22px}
.weeknote b{color:var(--tx);font-weight:500}

.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 0 0;margin-top:30px;border-top:1px solid var(--line)}
.figs div b{display:block;font-size:30px;line-height:1.05;white-space:nowrap}
.figs div b small{font-family:Onest;font-size:13px;font-weight:500;color:var(--mut);margin-left:3px;font-stretch:100%}
.figs div span{font-size:13px;color:var(--mut)}

/* строки списков */
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.li:active{opacity:.55}
.li .t{font-size:16.5px;font-weight:500;letter-spacing:-.01em}
.li .s{font-size:14px;color:var(--mut);margin-top:1px}
.li .v{font-size:20px;white-space:nowrap}
.li .chev{color:var(--mut2);width:18px;height:18px}
.pr{font-family:Onest;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--acc);margin-left:6px;vertical-align:2px;font-stretch:100%}
.go{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none}
.go svg{width:15px;height:15px;margin-left:2px}

/* активность */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--bg2)}
.heat i.l1{background:color-mix(in srgb,var(--tx) 28%,var(--bg2))}
.heat i.l2{background:color-mix(in srgb,var(--tx) 58%,var(--bg2))}
.heat i.l3{background:var(--tx)}
.heat i.f{visibility:hidden}
.heat i.t{box-shadow:0 0 0 1.5px var(--acc)}
.heatm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}

/* история */
.hrow{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);width:100%}
.hrow:active{opacity:.55}
.hrow .d b{display:block;font-size:34px;line-height:.95}
.hrow .d span{font-size:12.5px;color:var(--mut)}
.hrow h3{font-size:17px;font-weight:600;letter-spacing:-.015em}
.hrow .m{font-size:14px;color:var(--mut);margin:2px 0 8px}
.hrow .x{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:1px 0}
.hrow .x span:last-child{font-size:16px;white-space:nowrap}
.month{font-size:14px;color:var(--mut);margin:30px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line);text-transform:capitalize}

/* поиск и фильтры */
.search{display:flex;align-items:center;gap:8px;height:42px;border-radius:12px;background:var(--bg2);padding:0 12px;color:var(--mut)}
.search input{flex:1;height:100%;font-size:17px;color:var(--tx)}
.search input::placeholder{color:var(--mut)}
.search svg{width:18px;height:18px}
.filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:12px calc(-1 * var(--gut)) 4px;padding:0 var(--gut)}
.filters::-webkit-scrollbar{display:none}
.filters button{height:34px;padding:0 13px;border-radius:17px;font-size:15px;color:var(--mut);white-space:nowrap;flex:none}
.filters button.on{background:var(--tx);color:var(--bg)}
.grp{font-size:13px;color:var(--mut);margin:26px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* таб-бар */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(var(--sb) + 4px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-top:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--mut);padding:3px 0}
#tabs button.on{color:var(--tx)}
#tabs button.on svg{stroke-width:2.1}
#mini{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 70px);z-index:29;display:none;align-items:center;gap:12px;height:54px;padding:0 8px 0 16px;border-radius:16px;background:var(--tx);color:var(--bg)}
#mini.on{display:flex}
#mini .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 1.6s infinite;flex:none}
#mini b{font-size:15px;font-weight:600}
#mini .n{font-size:18px;opacity:.7}
#mini .btn{background:var(--bg);color:var(--tx)}
@keyframes blink{50%{opacity:.25}}

/* экран тренировки */
#wo{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(102%);transition:transform .45s cubic-bezier(.22,.9,.25,1);display:flex;flex-direction:column}
#wo.on{transform:none}
.wohd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:calc(var(--st) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.wohd .clock{text-align:center;font-size:24px;line-height:1}
.wohd .clock small{display:block;font-family:Onest;font-size:11.5px;color:var(--mut);font-weight:400;font-stretch:100%;margin-top:3px}
.wobody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px var(--gut) calc(var(--sb) + 140px)}
.woname{width:100%;font-size:26px;font-weight:600;letter-spacing:-.03em;padding:0}
.wostat{display:flex;gap:18px;font-size:14px;color:var(--mut);margin:4px 0 6px}
.wostat .n{font-size:17px;color:var(--tx)}
.wex{padding-top:28px}
.wex .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.wex .hd button.nm{flex:1;min-width:0}
.wex .hd h3{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.wex .hd small{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
.wex .hd small .n{font-size:15px;color:var(--tx)}
.sets .set,.sets .sh{display:grid;grid-template-columns:30px 1fr 78px 64px 44px;gap:6px;align-items:center}
.sets .sh{font-size:12px;color:var(--mut);padding:0 0 6px}
.sets .sh span:nth-child(n+3){text-align:center}
.sets .set{height:52px;padding:0 4px;margin:0 -4px 2px;border-radius:12px;transition:background .2s,color .2s}
.sets .sn{height:44px;font-size:18px;color:var(--mut);text-align:left;padding-left:4px}
.sets .set.wu .sn{color:var(--acc);font-family:Onest;font-size:14px;font-weight:600;font-stretch:100%}
.sets .prev{height:44px;font-size:17px;color:var(--mut);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets .in{height:44px;border-radius:10px;background:var(--bg2);text-align:center;font-size:22px;width:100%;transition:background .2s,color .2s}
.sets .in:focus{background:var(--bg);box-shadow:inset 0 0 0 2px var(--acc);outline:0}
.sets .in::placeholder{color:var(--mut2)}
.sets .na{text-align:center;color:var(--mut2)}
.sets .ck{height:44px;border-radius:10px;background:var(--bg2);color:var(--mut2);display:flex;align-items:center;justify-content:center}
.sets .ck svg{stroke-width:2.4}
.sets .set.done{background:var(--tx);color:var(--bg)}
.sets .set.done .in,.sets .set.done .ck{background:transparent;color:var(--bg)}
.sets .set.done .sn,.sets .set.done .prev{color:color-mix(in srgb,var(--bg) 55%,var(--tx))}
.sets .set.done .ck svg{animation:tick .3s ease-out}
@keyframes tick{from{transform:scale(.6);opacity:0}}
.wex .ft{display:flex;gap:20px;padding:8px 4px 0;font-size:15px}
.wex .ft button{color:var(--acc);font-weight:500;padding:6px 0}
.wex .ft button.m{color:var(--mut);font-weight:400}

/* таймер отдыха */
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 132px);z-index:60;display:flex;align-items:center;gap:6px;height:68px;padding:0 8px 0 18px;border-radius:18px;background:var(--tx);color:var(--bg);overflow:hidden;transform:translateY(calc(100% + 140px));transition:transform .4s cubic-bezier(.22,.9,.25,1)}
#rest:not(.on){visibility:hidden;opacity:0;transition:transform .4s,opacity .3s,visibility 0s .4s}
#rest.on{transform:none}
#rest.inwo{bottom:calc(var(--sb) + 12px)}
#rest .bar{position:absolute;left:0;top:0;width:100%;height:3px;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform 1s linear}
#rest .t{flex:1}
#rest .t b{font-size:34px;line-height:1;display:block}
#rest .t span{font-size:12px;opacity:.6}
#rest button{height:44px;padding:0 11px;border-radius:12px;font-size:15px;font-weight:500;color:var(--bg)}
#rest button.n{font-size:18px}
#rest button:active{background:color-mix(in srgb,var(--bg) 14%,transparent)}

/* шторки */
.sw{position:fixed;inset:0;z-index:100}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100dvh - var(--st) - 20px);background:var(--sheet);border-radius:20px 20px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px var(--gut) calc(var(--sb) + 20px)}
.sheet.full{height:calc(100dvh - var(--st) - 20px)}
.sw.in .scrim{animation:fade .3s}
.sw.in .sheet{animation:up .42s cubic-bezier(.22,.9,.25,1)}
.sw.out .scrim{animation:fade .22s reverse forwards}
.sw.out .sheet{animation:down .22s ease-in forwards}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.grab{height:20px;display:flex;justify-content:center;align-items:center;position:sticky;top:-6px;margin:-6px calc(-1 * var(--gut)) 6px;background:var(--sheet);z-index:3}
.grab:before{content:"";width:36px;height:5px;border-radius:3px;background:var(--bg3)}
.shd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.shd h3{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.shd p{font-size:14px;color:var(--mut);margin-top:3px}
.photo{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:var(--photo);margin:4px 0 20px}
.photo img,.photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo video{object-position:50% 30%}
.photo.vid{aspect-ratio:16/10;background:var(--bg2)}
.photo.vid.tall{aspect-ratio:4/5}
.photo{filter:var(--photo-f,none)}
.photo img+img{animation:swap 2.8s ease-in-out infinite}
@keyframes swap{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.exacts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chipb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 11px;border-radius:18px;background:var(--bg2);font-size:14.5px;font-weight:500;color:var(--tx);text-decoration:none}
.chipb svg{width:16px;height:16px}
.chipb.on{background:var(--tx);color:var(--bg)}
.vtag{color:var(--acc);display:flex}.vtag svg{width:13px;height:13px}
.grp.mine{color:var(--acc);font-weight:600}
.cue{font-size:15.5px;line-height:1.5;margin:-6px 0 4px}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:2px;margin:14px 0 6px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--mut);text-align:center}
.seg button.on{background:var(--seg-on,var(--bg));color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}
.chart text{font:400 11px Onest,system-ui;fill:var(--mut)}
.chart .lab{font:650 13px Num,system-ui;font-stretch:72%;fill:var(--tx)}
.ce{height:100px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:14px;padding:0 24px}
.field{display:block;width:100%;height:50px;border-radius:12px;background:var(--bg2);padding:0 14px;font-size:17px;margin-bottom:10px}
.field:focus{box-shadow:inset 0 0 0 2px var(--acc)}
.lab2{font-size:13px;color:var(--mut);margin:20px 0 8px}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.acts.h{flex-direction:row;gap:10px}
.pick{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%}
.pick .cb{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mut2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--bg);transition:background .15s}
.pick .cb svg{width:14px;height:14px;stroke-width:3;opacity:0}
.pick.on .cb{background:var(--tx);box-shadow:none}
.pick.on .cb svg{opacity:1}
.stick{position:sticky;bottom:calc(-1 * var(--sb) - 20px);margin:14px calc(-1 * var(--gut)) calc(-1 * var(--sb) - 20px);padding:12px var(--gut) calc(var(--sb) + 14px);background:linear-gradient(transparent,var(--sheet) 28%)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;height:54px;font-size:17px;border-bottom:1px solid var(--line)}
.menu button:last-child{border:0}
.menu .red{color:var(--red)}
.sum{padding:8px 0 4px}
.sum .big{font-size:72px;line-height:.95}
.sum .big small{font-family:Onest;font-size:20px;font-weight:500;color:var(--mut);font-stretch:100%;margin-left:6px}

/* настройки */
.group{background:var(--bg2);border-radius:14px;overflow:hidden}
.set-r{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;width:100%;font-size:16px;position:relative}
.set-r+.set-r:before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--bg3)}
.set-r .k{flex:1}
.set-r .v{color:var(--mut)}
.set-r.red .k{color:var(--red)}
.tg{width:51px;height:31px;border-radius:16px;background:var(--bg3);position:relative;flex:none;transition:background .25s}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.22,1,.36,1);box-shadow:0 2px 5px rgba(0,0,0,.2)}
.tg.on{background:var(--acc)}
.tg.on:after{transform:translateX(20px)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:36px;height:32px;border-radius:8px;font-size:20px;color:var(--acc)}
.step b{min-width:26px;text-align:center;font-size:20px}
.opts{display:flex;gap:4px;flex-wrap:wrap;padding:0 12px 12px}
.opts button{height:32px;padding:0 12px;border-radius:9px;font-size:14.5px;color:var(--mut)}
.opts button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:12px}
.th{border-radius:14px;padding:10px;height:78px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.th.on{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--acc)}
.th i{display:flex;gap:4px}.th i b{width:14px;height:14px;border-radius:50%}
.th span{font-size:12.5px;font-weight:600;line-height:1.15}
.accs{display:flex;gap:14px;padding:14px 16px}
.accs button{width:30px;height:30px;border-radius:50%}
.accs button.on{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--tx)}
.namein{font-size:30px;font-weight:600;letter-spacing:-.03em;width:100%;padding:0}
.namein::placeholder{color:var(--mut2)}
.foot{font-size:13px;color:var(--mut);margin:28px 0 0;line-height:1.55}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;min-height:150px;margin:10px 0}
.plates .bar{width:48px;height:10px;border-radius:2px;background:var(--mut2)}
.plates .col{width:8px;height:24px;background:var(--mut);border-radius:2px}
.plates .pl{border-radius:4px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:13px;color:#fff}
.note{font-size:14px;color:var(--mut);line-height:1.5}
.empty{padding:28px 0;color:var(--mut);font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--tx);font-size:17px;font-weight:600;margin-bottom:4px}

.mcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:22px;padding:16px;border-radius:16px;background:var(--bg2);text-align:left}
.mcard b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.mcard .eyebrow{margin:0}
.mcard.new{background:var(--tx);color:var(--bg)}
.mcard.new .eyebrow{color:var(--acc)}
.mhead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;margin:4px -8px 6px}
.mhead h3{font-size:22px;font-weight:600;letter-spacing:-.02em}
.mhead .eyebrow{display:block;margin:0}
.mhero{padding:26px 0 4px;text-align:left}
.mhero h2{font-size:32px;line-height:1.08;font-weight:600;letter-spacing:-.035em}
.mhero p{font-size:16px;color:var(--mut);margin-top:10px;line-height:1.45}
.figs em{font-style:normal;font-family:Num,Onest;font-stretch:72%;font-weight:650;font-size:14px;margin-left:4px}
.figs em.up{color:var(--acc)}.figs em.dn{color:var(--mut)}
.mrow{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow .t{font-size:16px;font-weight:500}
.mrow .s{font-size:16px;color:var(--mut);margin-top:2px}
.mrow .pc{font-size:22px}
.mbar{display:block;height:6px;border-radius:3px;background:var(--bg2);margin-top:10px;overflow:hidden;flex:1}
.mbar b{display:block;height:100%;border-radius:3px;background:var(--acc)}
.tagn{font-size:12px;font-weight:600;color:var(--mut);background:var(--bg2);padding:3px 8px;border-radius:7px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}
.mcal span{font-size:12px;color:var(--mut)}
.mcal b{height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mut)}
.mcal b.on{background:var(--tx);color:var(--bg)}
.gbar{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:10px;font-size:14.5px;padding:6px 0}
.gbar .mbar{margin:0}.gbar .n{text-align:right;font-size:16px}
.goals{list-style:none;counter-reset:g;margin:6px 0 10px}
.goals li{counter-increment:g;position:relative;padding:12px 0 12px 34px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.4}
.goals li:before{content:counter(g);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on);font:650 13px/22px Num,Onest;font-stretch:72%;text-align:center}
.goals .n{font-size:17px}
.notice{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:14px 8px 14px 16px;border-radius:14px;background:var(--bg2);flex-wrap:wrap}
.notice p{flex:1;min-width:200px;font-size:14.5px;line-height:1.45}
.notice.warn{background:color-mix(in srgb,var(--red) 12%,var(--bg))}
.notice .ib{margin:-8px 0 0}
.notice .btn{margin-left:auto}
.steps{list-style:none;counter-reset:s;margin:30px 0 0;border-top:1px solid var(--line)}
.steps li{counter-increment:s;position:relative;padding:14px 0 14px 40px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.4;color:var(--mut)}
.steps li b{color:var(--tx);font-weight:600}
.steps li:before{content:counter(s);position:absolute;left:0;top:13px;width:26px;height:26px;border-radius:50%;background:var(--bg2);color:var(--tx);font:650 15px/26px Num,Onest;font-stretch:72%;text-align:center}
.wex .hd small .goal{color:var(--acc)}
.wex .hd small .goal .n{color:var(--acc)}
.sumh{font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin-top:8px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 10px);z-index:200;transform:translate(-50%,-180%);transition:transform .45s cubic-bezier(.22,.9,.25,1);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:15px;font-weight:500;width:max-content;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast:not(.on){visibility:hidden;box-shadow:none;transition:transform .45s,visibility 0s .45s}
#toast.on{transform:translate(-50%,0)}
#toast .pr{color:var(--acc);margin:0 6px 0 0;vertical-align:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){#main,.wobody{max-width:560px;margin:0 auto;left:0;right:0}.sheet{max-width:560px;margin:0 auto}#tabs{padding-left:calc(50% - 280px);padding-right:calc(50% - 280px)}#mini,#rest{max-width:536px;margin:0 auto}}
</style>
</head>
<body>
<div id="main" class="scroll"></div>
<div id="mini"></div>
<nav id="tabs"></nav>
<div id="wo"></div>
<div id="rest"></div>
<div id="sheets"></div>
<div id="toast" role="status"></div>
<input id="file" type="file" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
